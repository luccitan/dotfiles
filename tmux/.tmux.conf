#
# Tmux configuration
#
#  Keybindings, display, and plugin setup for tmux.
#  Plugins are managed by TPM (Tmux Plugin Manager) — loaded last.
#

# --- Environment -------------------------------------------------------------

# Explicitly set PATH for tmux sessions (user profile not sourced in run commands)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"
# TPM path must be set before plugins are loaded (circular dependency otherwise)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# --- General -----------------------------------------------------------------

set-option -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"       # 256-color terminal type
set -ga terminal-overrides ",xterm-256color:Tc" # enable true color passthrough
set -g base-index 1                            # start window numbering at 1
set -g mouse on                                # enable mouse (click, scroll, resize)
set-option -g allow-rename off                 # prevent automatic window renaming

# --- Notifications -----------------------------------------------------------

set -g visual-activity on    # show message when activity detected in a window
set -g visual-bell on        # flash status bar instead of audible bell
set -g monitor-activity on   # monitor windows for activity

# --- Key bindings ------------------------------------------------------------

unbind C-b                                          # unbind default prefix
set-option -g prefix C-t                            # set prefix to Ctrl+T
bind r source ~/.tmux.conf                          # prefix+r: reload config
bind h split-window -h -c "#{pane_current_path}"    # prefix+h: horizontal split
bind v split-window -v -c "#{pane_current_path}"    # prefix+v: vertical split
bind -n M-Left  select-pane -L                      # Alt+←: focus left pane
bind -n M-Right select-pane -R                      # Alt+→: focus right pane
bind -n M-Up    select-pane -U                      # Alt+↑: focus upper pane
bind -n M-Down  select-pane -D                      # Alt+↓: focus lower pane
bind -n M-c     new-window -c "#{pane_current_path}" # Alt+c: new window
bind -n M-&     kill-window                          # Alt+&: kill window
bind -n M-p     previous-window                      # Alt+p: prev window
bind -n M-n     next-window                          # Alt+n: next window
bind -n M-1     select-window -t 1                   # Alt+1-9: select window by index
bind -n M-2     select-window -t 2
bind -n M-3     select-window -t 3
bind -n M-4     select-window -t 4
bind -n M-5     select-window -t 5
bind -n M-6     select-window -t 6
bind -n M-7     select-window -t 7
bind -n M-8     select-window -t 8
bind -n M-9     select-window -t 9

# --- Display -----------------------------------------------------------------

set -g pane-border-status bottom                                # show pane label at bottom border
set-option -g pane-border-format "#P: #{pane_current_command}"  # pane label: index + running command
set -g status-right 'Continuum: #{continuum_status}'            # show continuum save status in statusbar

# --- Plugins -----------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'              # TPM — plugin manager
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save and restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # automatic periodic session saving
set -g @plugin 'wfxr/tmux-power'               # theme

# Resurrect options
set -g @resurrect-strategy-nvim 'session'   # restore nvim sessions using Session.vim
set -g @resurrect-capture-pane-contents 'on'  # also restore pane content

# Continuum options
set -g @continuum-restore 'on'          # auto-restore last saved session on tmux start
set -g @continuum-save-interval '15'    # save interval in minutes

# --- Init (must be last) -----------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'